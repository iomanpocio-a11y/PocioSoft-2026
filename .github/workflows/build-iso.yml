name: Build PocioSoft 2026 ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debian 13 Live ISO (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out PocioSoft source
        uses: actions/checkout@v4

      - name: Build ISO in privileged Debian Trixie container
        shell: bash
        run: |
          set -euo pipefail
          docker pull debian:trixie
          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
                ca-certificates
              dpkg-query -W live-build isolinux syslinux-common
              lb config \
                --mode debian \
                --initsystem systemd \
                --distribution trixie \
                --architectures amd64 \
                --binary-images iso-hybrid \
                --archive-areas "main contrib non-free non-free-firmware" \
                --apt-recommends false \
                --firmware-chroot false \
                --security false \
                --iso-application "PocioSoft 2026" \
                --iso-volume "POCIOSOFT_2026"
              mkdir -p config/package-lists config/includes.chroot/etc/apt/sources.list.d
              cat > config/includes.chroot/etc/apt/sources.list.d/debian-security.list <<EOF
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
              cat > config/package-lists/pociosoft.list.chroot <<EOF
          task-lxqt-desktop
          firefox-esr
          network-manager
          qterminal
          featherpad
          ark
          gvfs
          gvfs-backends
          papirus-icon-theme
          arc-theme
          fonts-noto
          fonts-noto-color-emoji
          sudo
          curl
          wget
          htop
          calamares
          live-config
          live-config-systemd
          user-setup
          firmware-linux
          firmware-iwlwifi
          firmware-realtek
          firmware-amd-graphics
          firmware-misc-nonfree
          intel-microcode
          amd64-microcode
          EOF
              lb build
              ISO="$(find . -maxdepth 1 -type f -name "*.iso" -print -quit)"
              test -n "$ISO"
              test -s "$ISO"
              xorriso -indev "$ISO" -toc
              sha256sum "$ISO" > "$ISO.sha256"
              ls -lh "$ISO" "$ISO.sha256"
            '

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocioSoft-2026-x64-ISO
          path: |
            *.iso
            *.iso.sha256
          if-no-files-found: error
          retention-days: 14
