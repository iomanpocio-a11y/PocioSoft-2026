name: Build PocioSoft 2026 ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debian 13 Live ISO (x86_64)
    runs-on: ubuntu-24.04
    # Use Debian Trixie's own live-build package and bootloader assets.
    # The previous Ubuntu-host build mixed Ubuntu live-build with a Debian
    # Trixie target and repeatedly failed in binary_syslinux.
    container:
      image: debian:trixie
    timeout-minutes: 360
    steps:
      - name: Check out PocioSoft source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            ca-certificates

      - name: Verify Debian bootloader assets before building
        run: |
          set -eux
          dpkg-query -W live-build isolinux syslinux-common
          test -s /usr/lib/ISOLINUX/isolinux.bin
          test -s /usr/lib/syslinux/modules/bios/vesamenu.c32
          test -e /usr/share/live/build/bootloaders/isolinux/isolinux.bin
          test -e /usr/share/live/build/bootloaders/syslinux_common/vesamenu.c32
          readlink -f /usr/share/live/build/bootloaders/isolinux/isolinux.bin
          readlink -f /usr/share/live/build/bootloaders/syslinux_common/vesamenu.c32

      - name: Configure Debian 13 Live
        run: |
          set -eux
          lb config \
            --mode debian \
            --initsystem systemd \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends false \
            --firmware-chroot false \
            --security false \
            --iso-application "PocioSoft 2026" \
            --iso-volume "POCIOSOFT_2026"

      - name: Add desktop and utility packages
        run: |
          set -eux
          mkdir -p config/package-lists config/includes.chroot/etc/apt/sources.list.d
          cat > config/includes.chroot/etc/apt/sources.list.d/debian-security.list <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          cat > config/package-lists/pociosoft.list.chroot <<'EOF'
          task-lxqt-desktop
          firefox-esr
          network-manager
          qterminal
          featherpad
          ark
          gvfs
          gvfs-backends
          papirus-icon-theme
          arc-theme
          fonts-noto
          fonts-noto-color-emoji
          sudo
          curl
          wget
          htop
          calamares
          live-config-systemd
          firmware-linux
          firmware-iwlwifi
          firmware-realtek
          firmware-amd-graphics
          firmware-misc-nonfree
          intel-microcode
          amd64-microcode
          EOF

      - name: Build ISO image
        run: |
          set -eux
          lb build

      - name: Validate generated ISO
        run: |
          set -eux
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          xorriso -indev "$ISO" -toc
          ls -lh "$ISO"
          sha256sum "$ISO" | tee "$ISO.sha256"

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocioSoft-2026-x64-ISO
          path: |
            *.iso
            *.iso.sha256
          if-no-files-found: error
          retention-days: 14
