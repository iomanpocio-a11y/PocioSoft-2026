name: Build PocioSoft 2026 ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Debian Live ISO (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out PocioSoft source
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common

      - name: Configure Debian 13 Live
        run: |
          lb config \
            --mode debian \
            --initsystem systemd \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends false \
            --firmware-chroot false \
            --security false \
            --iso-application "PocioSoft 2026" \
            --iso-volume "POCIOSOFT_2026"

      - name: Add desktop and utility packages
        run: |
          mkdir -p config/package-lists config/includes.chroot/etc/apt/sources.list.d
          cat > config/includes.chroot/etc/apt/sources.list.d/debian-security.list <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          cat > config/package-lists/pociosoft.list.chroot <<'EOF'
          task-lxqt-desktop
          firefox-esr
          network-manager
          qterminal
          featherpad
          ark
          gvfs
          gvfs-backends
          papirus-icon-theme
          arc-theme
          fonts-noto
          fonts-noto-color-emoji
          sudo
          curl
          wget
          htop
          calamares
          live-config-systemd
          firmware-linux
          firmware-iwlwifi
          firmware-realtek
          firmware-amd-graphics
          firmware-misc-nonfree
          intel-microcode
          amd64-microcode
          EOF

      - name: Add ISOLINUX chroot hook
        run: |
          set -e
          mkdir -p config/hooks/normal
          cat > config/hooks/normal/010-prepare-isolinux.hook.chroot <<'EOF'
          #!/bin/sh
          set -eu
          mkdir -p /usr/lib/syslinux
          ISOLINUX_BIN="$(find /usr/lib -type f -name isolinux.bin -print -quit)"
          VESAMENU="$(find /usr/lib -type f -name vesamenu.c32 -print -quit)"
          test -n "$ISOLINUX_BIN"
          test -n "$VESAMENU"
          install -m 0644 "$ISOLINUX_BIN" /usr/lib/syslinux/isolinux.bin
          install -m 0644 "$VESAMENU" /usr/lib/syslinux/vesamenu.c32
          test -s /usr/lib/syslinux/isolinux.bin
          test -s /usr/lib/syslinux/vesamenu.c32
          EOF
          chmod +x config/hooks/normal/010-prepare-isolinux.hook.chroot

      - name: Build ISO image
        run: sudo lb build

      - name: Validate generated ISO
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          xorriso -indev "$ISO" -toc
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"
          ls -lh "$ISO"

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocioSoft-2026-x64-ISO
          path: ${{ env.ISO_PATH }}
          if-no-files-found: error
          retention-days: 14

  auto-rerun:
    name: Automatically retry failed build (maximum 2 retries)
    needs: build
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: gh run rerun "$RUN_ID" --failed
